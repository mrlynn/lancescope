name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run of the same ref is still going cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Lint only. `uv sync` would pull torch and open-clip — gigabytes for a job
      # that reads source, and the pipeline needs ffmpeg and a GPU to say anything
      # useful anyway. `make verify` is the real test and it needs the corpus,
      # which is gitignored; it runs locally as the green-room check.
      - run: uvx ruff@0.16.5 check .

  tests:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Only the `test` group: lance, pyarrow, fastapi and pytest. Deliberately not
      # `uv sync`, which would pull torch and open-clip — gigabytes of machine
      # learning to check that a filter is pushed down. The console does not import
      # them, and the tests build their own Lance tables in a temp directory.
      - run: uv sync --only-group test
      - run: uv run --no-sync python -m pytest

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
