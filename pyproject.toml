[project]
name = "lancescope"
version = "0.3.0"
description = "LanceScope — visibility into LanceDB data, and the Ctrl-F for Video demo it grew out of"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data layer
    "lancedb>=0.26",
    # 3.0.0 and not lower, measured rather than assumed. `scripts/compat/probe.py`
    # installs each candidate and reads a real blob table with it: 0.38 has no
    # `io_stats_incremental`, so every byte figure in the console is missing; 1.0.4
    # does not recognise a Blob V2 column at all; 2.0.1 sees the column and then
    # fails to open it against storage format 2.2. 3.0.0 is the first release that
    # does all three. The old floor of 0.38 was a number nobody had checked.
    "pylance>=3",
    "pyarrow>=18",
    "numpy>=2.0",
    # media
    "av>=13",
    "pillow>=11",
    "yt-dlp>=2025.1.15",
    # embeddings
    "torch>=2.5",
    "open-clip-torch>=2.30",
    # the language layer — optional at runtime, not at install time: the console
    # works with no provider configured, but the Anthropic path needs its SDK present
    # to be one import away rather than a try/except around a missing package.
    "anthropic>=1.2",
    # The read surface as agent tools. Cheap to carry: the routes already exist and
    # this wraps them, so the intelligence is the caller's rather than ours.
    "mcp>=2.1",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiohttp>=3.11",
    "httpx>=0.28",
    # misc
    "tqdm>=4.67",
    "transformers>=4.46",
    "sentencepiece>=0.2",
]

[project.scripts]
lancescope = "ingest.cli:main"

# Present so that `[project.scripts]` is real rather than decorative — without a
# build backend uv treats this as a virtual project and never installs the entry
# point, which would leave `lancescope` documented and missing. Only the two import
# roots are packaged; `web/`, `desktop/` and `data/` are not Python.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "ingest"]

# The console, so `lancescope open` has something to serve from a bare install. It is
# a few megabytes of JavaScript in a wheel that is otherwise kilobytes of Python, and
# that is the price of the command being real rather than checkout-only. `make ui`
# writes it; a wheel built without it still installs, and `open` says which situation
# the reader is in rather than serving an API and no interface.
[tool.hatch.build.targets.wheel.force-include]
"web/out" = "server/ui"

[dependency-groups]
dev = ["ruff>=0.9"]

# What the packaged desktop app ships, and deliberately not what the repository
# installs. The console — catalog, query, compare, findings, settings, and a
# language layer that reaches a model over HTTP — needs no machine learning locally.
# torch and open-clip are two gigabytes that exist for the demo's SigLIP embedding,
# and shipping them in a desktop app to support one screen would quadruple the
# download for every user who never opens it.
#
# The demo stays a thing you run from a checkout. In a packaged build its routes
# report that they are unavailable, which they already do when the corpus is absent.
console = [
    "pylance>=3",
    # The media decoders, so the packaged app can create a database and not merely
    # promise to. Measured rather than guessed: pillow 14.1 MB, pypdfium2 8.0 MB and
    # pypdf 3.9 MB come to 26 MB, against the 493 MB of torch this group exists to
    # leave out and the 127 MB of pyarrow it already ships. That is the whole
    # argument — 26 MB turns "this build cannot decode a JPEG" into "this build
    # ingests images and PDFs", and it is not the trade the paragraph above refuses.
    #
    # ffmpeg is still absent, so video and audio remain checkout-only. It is a
    # binary rather than a wheel, an order of magnitude larger, and carries a
    # licensing decision nobody has made. `ingest/core/binaries.py` reports that per
    # medium, which is why this can be a partial answer instead of an all-or-nothing.
    "pillow>=11",
    "pypdfium2>=4.30",
    "pypdf>=5",
    "pyarrow>=18",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "httpx>=0.28",
    "anthropic>=1.2",
    "mcp>=2.1",
]

build = ["pyinstaller>=6.11"]

# Decoders the general media pipeline needs and the FOSDEM demo never did. Kept out
# of the main dependencies because each one is a modality: someone ingesting a photo
# library should not be made to install a PDF renderer, and `ingest/core/binaries.py`
# reports a missing one as a capability rather than failing at the file that needs it.
#
# pypdfium2 + pypdf rather than PyMuPDF: no external binary, so PDF is the one
# non-image modality that could work in the packaged app — and PyMuPDF is AGPL, which
# this ships as a signed desktop app.
ingest = [
    "pypdfium2>=4.30",
    "pypdf>=5",
    "pillow-heif>=0.21",
]

# What the contract tests need, and nothing else. Deliberately excludes torch and
# open-clip: the console does not import them, and a test job that pulls a gigabyte
# of machine learning to check that a filter is pushed down is a test job nobody
# will keep green. `make verify` remains the integration gate, on the real corpus.
test = [
    "pytest>=8.3",
    "pylance>=3",
    "pyarrow>=18",
    "numpy>=2.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    # The MCP tools are async, and the agent surface is exactly the one that needs
    # testing in CI rather than by hand.
    "pytest-asyncio>=0.24",
    "mcp>=2.1",
    # The media decoders, which are small pure wheels rather than the gigabyte this
    # group exists to avoid. Without them the handlers would only ever be exercised
    # by hand. The "this build has no decoder" paths stay covered because those tests
    # pin preflight rather than reading whatever the machine happens to have.
    "pillow>=11",
    "pypdfium2>=4.30",
    "pypdf>=5",
    # Only the tests get this. `server/intel/runconfig.py` renders its YAML by hand
    # precisely because pyyaml is not a dependency of the server — it is in the lock
    # only because something else pulled it in, and a route that relied on that
    # accident would break the first time the accident stopped happening. A real
    # parser reading the hand-rolled output back is what makes writing it by hand
    # safe, so the parser belongs here and nowhere else.
    "pyyaml>=6",
]

[tool.ruff]
line-length = 100

# Pinned explicitly rather than left to ruff's defaults: CI runs a pinned ruff, and
# an implicit ruleset means a ruff release can turn a green main red without anyone
# changing a line of code.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# `ingest` is a package now, but its demo-era modules are still put on sys.path at
# runtime, so `embed` and `config` are ours too even though they resolve like
# third-party modules.
[tool.ruff.lint.isort]
known-first-party = ["server", "ingest", "embed", "config"]

[tool.ruff.lint.per-file-ignores]
# The server and scripts put ingest/ on sys.path before importing from it, so those
# imports genuinely cannot come first.
"server/main.py" = ["E402"]
"scripts/*.py" = ["E402"]
