[project]
name = "ctrl-f-for-video"
version = "0.1.0"
description = "Ctrl-F for Video — a LanceDB Blob V2 + multimodal search demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data layer
    "lancedb>=0.26",
    "pylance>=0.38",
    "pyarrow>=18",
    "numpy>=2.0",
    # media
    "av>=13",
    "pillow>=11",
    "yt-dlp>=2025.1.15",
    # embeddings
    "torch>=2.5",
    "open-clip-torch>=2.30",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiohttp>=3.11",
    "httpx>=0.28",
    # misc
    "tqdm>=4.67",
    "transformers>=4.46",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 100
