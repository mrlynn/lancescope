[project]
name = "lancescope"
version = "0.1.0"
description = "LanceScope — visibility into LanceDB data, and the Ctrl-F for Video demo it grew out of"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data layer
    "lancedb>=0.26",
    "pylance>=0.38",
    "pyarrow>=18",
    "numpy>=2.0",
    # media
    "av>=13",
    "pillow>=11",
    "yt-dlp>=2025.1.15",
    # embeddings
    "torch>=2.5",
    "open-clip-torch>=2.30",
    # the language layer — optional at runtime, not at install time: the console
    # works with no provider configured, but the Anthropic path needs its SDK present
    # to be one import away rather than a try/except around a missing package.
    "anthropic>=1.2",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiohttp>=3.11",
    "httpx>=0.28",
    # misc
    "tqdm>=4.67",
    "transformers>=4.46",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 100

# Pinned explicitly rather than left to ruff's defaults: CI runs a pinned ruff, and
# an implicit ruleset means a ruff release can turn a green main red without anyone
# changing a line of code.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ingest/ is put on sys.path at runtime rather than being a package, so `embed` and
# `config` are ours even though they resolve like third-party modules.
[tool.ruff.lint.isort]
known-first-party = ["server", "embed", "config"]

[tool.ruff.lint.per-file-ignores]
# The server and scripts put ingest/ on sys.path before importing from it, so those
# imports genuinely cannot come first.
"server/main.py" = ["E402"]
"scripts/*.py" = ["E402"]
