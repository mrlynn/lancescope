[pytest]
testpaths = tests
# `server` imports `config` and `embed` from ingest/, which is on sys.path at
# runtime rather than being a package. Tests import the console only, which needs
# neither — but the path has to be right for the ones that touch settings.
pythonpath = . ingest
addopts = -q
# The MCP tools are async and there is nothing interesting about writing
# `@pytest.mark.asyncio` on every one of them.
asyncio_mode = auto
